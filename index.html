<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trạm Luyện Toán</title><style>body{margin:auto;max-width:900px;padding:24px;background:#101329;color:#eef2ff;font:17px system-ui}h1{font-size:clamp(2.5rem,7vw,5rem);margin:.3em 0}a{color:#91f3da}details,fieldset{border:1px solid #565879;border-radius:14px;padding:12px;margin:12px 0;background:#1b2040}summary{cursor:pointer}label{display:inline-block;margin:5px 12px 5px 0}input{font:inherit;max-width:12em}p{line-height:1.5}</style><header><h1>Trạm Luyện Toán</h1><p>Thư viện tự luyện · Lớp 12</p></header><main><details open><summary>Cuối học kỳ I</summary><div id="exam">Đang tải…</div></details></main><script>
const root=document.getElementById('exam');const add=(parent,tag,text)=>{const n=document.createElement(tag);if(text)n.textContent=text;parent.append(n);return n};async function start(){const response=await fetch('./data/de/lop-12/cuoi-hk1/le-hong-phong-ca-mau-201.json');if(!response.ok)throw Error();const e=await response.json();root.replaceChildren();add(root,'h2',e.title);const link=add(root,'a','Mở PDF đề gốc (tab mới)');link.href=e.source;link.target='_blank';link.rel='noopener noreferrer';add(root,'p',`Thời gian đề gốc: ${e.durationMinutes} phút. Đọc câu hỏi và hình vẽ trong PDF, rồi ghi đáp án ở đây. Bản này chưa tự chấm điểm.`);const status=add(root,'p','');status.setAttribute('role','status');let answers={};try{answers=JSON.parse(localStorage.getItem(e.id))||{}}catch{}function save(k,v){if(v.trim())answers[k]=v;else delete answers[k];try{localStorage.setItem(e.id,JSON.stringify(answers));update()}catch{update(' · Không lưu được trên thiết bị này')}}function update(note=''){status.textContent=`Đã điền ${Object.keys(answers).length}/34 mục${note}.`};update();function radios(parent,key,options){for(const v of options){const l=add(parent,'label');const n=add(l,'input');n.type='radio';n.name=key;n.checked=answers[key]===v;n.onchange=()=>save(key,v);l.append(' '+v)}}e.sections.forEach((s,j)=>{const d=add(root,'details');if(!j)d.open=true;add(d,'summary',s.title);for(let i=1;i<=s.count;i++){const f=add(d,'fieldset');add(f,'legend',`Câu ${i}`);const key=`${j}-${i}`;if(s.type==='mc')radios(f,key,['A','B','C','D']);else if(s.type==='tf'){for(let k=0;k<s.items;k++){const g=add(f,'fieldset');add(g,'legend','abcd'[k]+')');radios(g,`${key}-${k}`,['Đúng','Sai'])}}else{const l=add(f,'label','Đáp số: ');const n=add(l,'input');n.inputMode='decimal';n.value=answers[key]||'';n.oninput=()=>save(key,n.value)}}})}start().catch(()=>{root.textContent='Không tải được dữ liệu. Hãy mở trang qua máy chủ web thay vì mở trực tiếp tệp HTML.'});</script></html>
